<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard</title><link rel="stylesheet" href="style.css"><script defer src="config.js"></script><script defer src="api.js"></script><script defer src="auth.js"></script><script defer src="cleancrew-staff.js"></script><script defer src="global-nav-role.js"></script><script defer src="production-engine.js"></script><script defer src="branding.js"></script></head><body><main class="page"><section class="center"><p class="eyebrow">Owner Dashboard</p><h1>Full business control</h1></section><section class="kpis" id="ownerKpis"></section><section class="workflow-panel"><h2>Add Home Clean</h2><form id="homeForm" class="workflow-form"><input name="clientName" placeholder="Client name" required><input name="clientPhone" placeholder="Client phone"><input name="address" placeholder="Address" required><input name="date" type="date" required><input name="time" type="time" required><select name="service"><option>Standard Clean</option><option>Deep Clean</option><option>Move-In/Move-Out</option><option>Airbnb Turnover</option></select><input name="price" type="number" placeholder="Client price"><input name="assignedTo" placeholder="Cleaner/team"><input name="payType" value="Per Home"><input name="payAmount" type="number" placeholder="Cleaner pay"><select name="paidStatus"><option>Unpaid</option><option>Deposit Paid</option><option>Paid In Full</option><option>Past Due</option></select><textarea name="notes" placeholder="Checklist / notes"></textarea><button class="btn">Save Home Clean</button></form><div class="result"></div></section><section class="workflow-panel"><h2>Homes To Clean</h2><div id="ownerHomesTable"></div></section></main></body></html>
