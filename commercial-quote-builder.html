<!doctype html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Quote Builder | CleanCrew Empire</title>
<link rel="stylesheet" href="style.css">
<script defer src="config.js"></script>
<script defer src="api.js"></script>
<script defer src="auth.js"></script>
<script defer src="cleancrew-staff.js"></script>
<script defer src="feature-fix.js"></script><script defer src="global-nav-role.js"></script>
<script defer src="production-engine.js"></script><script defer src="branding.js"></script></head>
<body>
<main class="page">

<section class="center"><p class="eyebrow">Office + Business Cleaning</p><h1>Commercial Quote Builder</h1><p class="lead">Build commercial cleaning quotes based on square footage, frequency, bathrooms, staff needed, supplies, travel, and desired margin.</p></section>
<section class="workflow-panel">
<form id="commercialCalcForm" class="workflow-form">
<input type="number" name="sqft" placeholder="Square footage" value="3500">
<input type="number" name="visits" placeholder="Visits per month" value="8">
<input type="number" name="bathrooms" placeholder="Bathrooms" value="4">
<input type="number" name="staff" placeholder="Staff needed" value="2">
<input type="number" name="margin" placeholder="Desired margin %" value="35">
<button class="btn">Calculate Commercial Quote</button>
</form>
<div id="featureOutput" class="result"></div>
</section>
</main>
<footer class="footer"><strong>CleanCrew Empire</strong> — real cleaning-business modules with role dashboards and Google Sheets-ready workflows.</footer>
</body>
</html>
